<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emisor de prueba</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1120; color: #e7ecf5;
           margin: 0; padding: 24px; max-width: 480px; margin: auto; }
    h1 { font-size: 20px; }
    p { color: #9fb0cc; line-height: 1.5; }
    input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #26324f;
            background: #151d33; color: #e7ecf5; font: inherit; margin: 6px 0 14px; box-sizing: border-box; }
    button { font: inherit; border: none; background: #4f7cff; color: white;
             padding: 12px 18px; border-radius: 10px; cursor: pointer; width: 100%; }
    #log { background: #151d33; border: 1px solid #26324f; border-radius: 12px;
           padding: 12px; margin-top: 16px; font-size: 13px; white-space: pre-wrap;
           min-height: 60px; }
    label { font-size: 13px; color: #9fb0cc; }
  </style>
</head>
<body>
  <h1>Emisor de prueba 📡</h1>
  <p>Esta pagina hace lo mismo que hará la app del celular: lee tu ubicación y la
     escribe en Firebase. Sirve para probar la página del mapa sin tener la app.</p>

  <label>Dirección de Firebase</label>
  <input id="url" placeholder="http://localhost:9450">

  <label>Clave secreta (20 letras o más)</label>
  <input id="clave" placeholder="liezd905mp61adx7spzaynwj">

  <button id="btn">Mandar mi ubicación ahora</button>
  <label style="display:block; margin-top:14px;">
    <input type="checkbox" id="auto" style="width:auto; margin-right:8px;"> Mandar sola cada 10 segundos
  </label>

  <div id="log">Listo para mandar.</div>

  <script src="config.js"></script>
  <script>
    // Rellena las casillas con lo de config.js para no escribirlo cada vez.
    document.getElementById("url").value = (window.CONFIG && window.CONFIG.urlBase) || "";
    document.getElementById("clave").value = (window.CONFIG && window.CONFIG.clave) || "";

    const log = (t) => { document.getElementById("log").textContent = t; };

    // Pide el GPS del navegador y devuelve una promesa con la posición.
    function posicionActual() {
      return new Promise((ok, mal) => {
        if (!navigator.geolocation) return mal(new Error("Este navegador no tiene GPS"));
        navigator.geolocation.getCurrentPosition(ok, mal, { enableHighAccuracy: true, timeout: 10000 });
      });
    }

    async function mandar() {
      const url = document.getElementById("url").value.trim().replace(/\/+$/, "");
      const clave = document.getElementById("clave").value.trim();
      if (clave.length < 20) { log("La clave debe tener 20 letras o más."); return; }
      try {
        log("Pidiendo tu ubicación…");
        const pos = await posicionActual();
        // Armamos el JSON con lo que sabemos.
        const dato = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          precision: pos.coords.accuracy,
          velocidad: pos.coords.speed,
          bateria: await bateria(),
          hora: Date.now()
        };
        // PUT = escribir (reemplaza lo que hubiera).
        const resp = await fetch(`${url}/celulares/${encodeURIComponent(clave)}/ultima.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dato)
        });
        if (!resp.ok) throw new Error("respuesta " + resp.status);
        log("✅ Enviado:\n" + JSON.stringify(dato, null, 2));
      } catch (e) {
        log("❌ Error: " + e.message);
      }
    }

    // La batería, si el navegador la deja leer (no todos).
    async function bateria() {
      try { const b = await navigator.getBattery(); return Math.round(b.level * 100); }
      catch (e) { return null; }
    }

    document.getElementById("btn").onclick = mandar;

    // Modo automático cada 10 segundos.
    let temporizador = null;
    document.getElementById("auto").onchange = (e) => {
      if (e.target.checked) { mandar(); temporizador = setInterval(mandar, 10000); }
      else { clearInterval(temporizador); }
    };
  </script>
</body>
</html>
