<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Dónde está mi celular?</title>

  <!-- Leaflet: la librería del mapa (mapas gratis de OpenStreetMap) -->
  <link rel="stylesheet" href="vendor/leaflet.css">
  <script src="vendor/leaflet.js"></script>

  <style>
    /* ---- Colores y tipografía ---- */
    :root {
      --fondo: #0b1120;
      --tarjeta: #151d33;
      --borde: #26324f;
      --texto: #e7ecf5;
      --suave: #9fb0cc;
      --verde: #35c66b;
      --rojo: #e5484d;
      --azul: #4f7cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Barra de arriba ---- */
    header {
      padding: 12px 16px;
      background: var(--tarjeta);
      border-bottom: 1px solid var(--borde);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    #estado {
      font-size: 13px;
      color: var(--suave);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #punto-estado {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--suave);
    }
    #punto-estado.vivo { background: var(--verde); }
    #punto-estado.viejo { background: var(--rojo); }

    /* ---- Fila de datos (hace cuánto, batería) ---- */
    #datos {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      background: var(--tarjeta);
      border-bottom: 1px solid var(--borde);
      overflow-x: auto;
    }
    .dato {
      background: var(--fondo);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 90px;
    }
    .dato .etq { font-size: 11px; color: var(--suave); }
    .dato .val { font-size: 16px; font-weight: 600; margin-top: 2px; }

    /* ---- El mapa ocupa todo lo que queda ---- */
    #mapa { flex: 1; }

    /* ---- Botones ---- */
    button {
      font: inherit;
      border: 1px solid var(--borde);
      background: var(--azul);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    button.gris { background: transparent; color: var(--suave); }

    /* ---- Ventana para pedir la configuración ---- */
    #config-caja {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      align-items: center; justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    #config-caja.visible { display: flex; }
    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 20px;
      width: 100%; max-width: 420px;
    }
    .tarjeta h2 { margin-top: 0; }
    .tarjeta label { display: block; font-size: 13px; color: var(--suave); margin: 12px 0 4px; }
    .tarjeta input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--borde);
      background: var(--fondo);
      color: var(--texto);
      font: inherit;
    }
    .tarjeta .fila { display: flex; gap: 10px; margin-top: 16px; }
    .tarjeta .fila button { flex: 1; }
    .ayuda { font-size: 12px; color: var(--suave); margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <h1>📍 Mi celular</h1>
    <div id="estado"><span id="punto-estado"></span><span id="estado-texto">Conectando…</span></div>
    <button class="gris" id="btn-config">⚙️ Ajustes</button>
  </header>

  <div id="datos">
    <div class="dato"><div class="etq">Último reporte</div><div class="val" id="d-hace">—</div></div>
    <div class="dato"><div class="etq">Batería</div><div class="val" id="d-bateria">—</div></div>
    <div class="dato"><div class="etq">Precisión</div><div class="val" id="d-precision">—</div></div>
    <div class="dato"><div class="etq">Velocidad</div><div class="val" id="d-velocidad">—</div></div>
  </div>

  <div id="mapa"></div>

  <!-- Ventana de ajustes (URL + clave) -->
  <div id="config-caja">
    <div class="tarjeta">
      <h2>Ajustes del rastreador</h2>
      <label>Dirección de Firebase</label>
      <input id="in-url" placeholder="https://mi-proyecto.firebaseio.com">
      <label>Clave secreta del celular</label>
      <input id="in-clave" placeholder="20 letras o más">
      <p class="ayuda">Estos datos se guardan solo en este navegador. Deben ser
        los mismos que pusiste dentro de la app del celular.</p>
      <div class="fila">
        <button class="gris" id="btn-cancelar">Cancelar</button>
        <button id="btn-guardar">Guardar</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/mapa.js"></script>
</body>
</html>
